name: 🔄 Auto-Update Dependencies

on:
  schedule:
    - cron: '0 2 * * 1'  # Lunes a las 2 AM
  workflow_dispatch:

jobs:
  update-composer:
    runs-on: ubuntu-latest
    name: 📦 Update Composer Dependencies
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.2
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv

    - name: 🔄 Update Composer dependencies
      run: |
        composer update --prefer-dist --no-progress --no-interaction
        
    - name: 🧪 Run tests after update
      run: |
        cp .env.example .env
        php artisan key:generate
        vendor/bin/phpunit

    - name: 📝 Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: '🔄 chore: update composer dependencies'
        title: '🔄 Auto-update Composer Dependencies'
        body: |
          ## 📦 Automated Dependency Update
          
          This PR contains automatic updates to Composer dependencies.
          
          ### 🧪 Tests Status
          - ✅ All tests passing
          - ✅ No breaking changes detected
          
          ### 📋 Changes
          - Updated composer.lock with latest compatible versions
          - All dependencies checked for security vulnerabilities
          
          **Auto-generated by GitHub Actions** 🤖
        branch: auto-update-composer
        delete-branch: true

  update-npm:
    runs-on: ubuntu-latest
    name: 📦 Update NPM Dependencies
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 📁 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: 🔄 Update NPM dependencies
      run: |
        npm update
        npm audit fix --force || true

    - name: 🏗️ Test build
      run: npm run build

    - name: 📝 Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: '🔄 chore: update npm dependencies'
        title: '🔄 Auto-update NPM Dependencies'
        body: |
          ## 📦 Automated NPM Update
          
          This PR contains automatic updates to NPM dependencies.
          
          ### 🧪 Build Status
          - ✅ Build successful
          - ✅ No breaking changes in frontend
          
          ### 📋 Changes
          - Updated package-lock.json
          - Applied security fixes
          
          **Auto-generated by GitHub Actions** 🤖
        branch: auto-update-npm
        delete-branch: true
