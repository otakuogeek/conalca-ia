name: 🚀 Deploy to Production

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v1.0.0, v1.1.0, etc.)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    name: 🏗️ Build Application
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.2
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql, bcmath, soap, intl, gd, exif, iconv

    - name: 📦 Install Composer dependencies
      run: composer install --prefer-dist --no-dev --optimize-autoloader

    - name: 📁 Install Node.js dependencies
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: 🎨 Build frontend assets
      run: |
        npm ci
        npm run build

    - name: 📦 Create deployment package
      run: |
        tar -czf ai-transport-deploy.tar.gz \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='node_modules' \
          --exclude='tests' \
          --exclude='.env*' \
          .

    - name: 📤 Upload deployment artifact
      uses: actions/upload-artifact@v3
      with:
        name: ai-transport-package
        path: ai-transport-deploy.tar.gz
        retention-days: 7

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.environment == 'staging' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    environment: staging
    name: 🧪 Deploy to Staging
    
    steps:
    - name: 📥 Download deployment package
      uses: actions/download-artifact@v3
      with:
        name: ai-transport-package

    - name: 🚀 Deploy to staging server
      run: |
        echo "🧪 Deploying to staging environment..."
        echo "📦 Package: ai-transport-deploy.tar.gz"
        echo "🌐 Environment: Staging"
        # Add your staging deployment commands here

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.event.inputs.environment == 'production' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    environment: production
    name: 🏭 Deploy to Production
    
    steps:
    - name: 📥 Download deployment package
      uses: actions/download-artifact@v3
      with:
        name: ai-transport-package

    - name: 🚀 Deploy to production server
      run: |
        echo "🏭 Deploying to production environment..."
        echo "📦 Package: ai-transport-deploy.tar.gz" 
        echo "🌐 Environment: Production"
        # Add your production deployment commands here

    - name: 📢 Notify deployment success
      run: |
        echo "## 🎉 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
        echo "🏭 **Environment**: Production" >> $GITHUB_STEP_SUMMARY
        echo "🏷️ **Version**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "⏰ **Time**: $(date)" >> $GITHUB_STEP_SUMMARY
